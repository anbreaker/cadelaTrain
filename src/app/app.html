@if (updateReady()) {
<app-update-banner (reload)="applyUpdate()" />
}
<app-site-header
  [isDark]="isDark()"
  [lang]="lang()"
  [navItems]="navItems()"
  [signedIn]="signedIn()"
  (langChange)="setLang($event)"
  (signOut)="signOut()"
  (themeToggle)="toggleTheme($event)"
/>
<router-outlet />
@if (busy()) {
<div class="app-loading" role="status" *transloco="let t">
  <app-brand size="large" />
  <span class="visually-hidden">{{ t('shell.loading') }}</span>
</div>
}
