<section
  class="unavailable-state"
  aria-labelledby="unavailable-title"
  role="status"
  *transloco="let t"
>
  <svg
    class="unavailable-state__icon"
    aria-hidden="true"
    fill="none"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="2"
    viewBox="0 0 24 24"
  >
    <path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0" />
    <path d="M12 20h.01" />
  </svg>
  <h1 class="unavailable-state__title" id="unavailable-title">{{ t('shell.unavailableTitle') }}</h1>
  <p class="unavailable-state__text">{{ t('shell.unavailableText') }}</p>
  <button class="button button--primary" type="button" (click)="retry.emit()">
    {{ t('shell.retry') }}
  </button>
</section>
