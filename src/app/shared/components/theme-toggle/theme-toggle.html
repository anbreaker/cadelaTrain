<ng-template #moon>
  <svg
    class="theme-toggle__moon"
    aria-hidden="true"
    fill="none"
    height="18"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="2"
    viewBox="0 0 24 24"
    width="18"
  >
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
  </svg>
</ng-template>
<ng-template #sun>
  <svg
    class="theme-toggle__sun"
    aria-hidden="true"
    fill="none"
    height="18"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="2"
    viewBox="0 0 24 24"
    width="18"
  >
    <circle cx="12" cy="12" r="4" />
    <path
      d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
    />
  </svg>
</ng-template>

<button
  class="theme-toggle"
  type="button"
  *transloco="let t"
  [attr.aria-label]="isDark() ? t('settings.switchToLight') : t('settings.switchToDark')"
  [title]="isDark() ? t('settings.switchToLight') : t('settings.switchToDark')"
  (click)="activate($event)"
>
  <span class="theme-toggle__icon theme-toggle__icon--current">
    <ng-container [ngTemplateOutlet]="isDark() ? moon : sun" />
  </span>
  <span class="theme-toggle__icon theme-toggle__icon--target">
    <ng-container [ngTemplateOutlet]="isDark() ? sun : moon" />
  </span>
</button>
